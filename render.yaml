# Render Blueprint for the backend API (Dashboard -> New -> Blueprint -> this repo).
# The website is deployed on Vercel; login is Supabase Auth.
services:
  - type: web
    name: nadf-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      # Supabase -> Connect -> "Session pooler" connection string, with your
      # database password in place of [YOUR-PASSWORD] (URL-encode @ as %40).
      - key: DATABASE_URL
        sync: false
      # Supabase -> Project Settings -> Data API -> Project URL (https://xxxx.supabase.co)
      - key: SUPABASE_URL
        sync: false
